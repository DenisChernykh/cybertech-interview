name: list-shop
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["shop-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shop:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/shop
      SMTP_HOST: mail
      SMTP_PORT: 1025
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shop:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/shop
      SMTP_HOST: mail
      SMTP_PORT: 1025
    command: python -m app.worker
    depends_on:
      api: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8026:8025", "127.0.0.1:1026:1025"]
volumes:
  shop-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${SHOP_SUBNET:-10.246.73.0/24}

