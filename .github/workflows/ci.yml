name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://shop:ci-test-only@localhost:5432/shop_test
      TEST_DATABASE_URL: postgresql+psycopg://shop:ci-test-only@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.6
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check app tests ../scripts
      - run: uv run --no-sync ruff format --check app tests ../scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
