server {
    listen 80;
    server_name shop.strelchukgo.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name shop.strelchukgo.ru;

    ssl_certificate /etc/letsencrypt/live/shop.strelchukgo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.strelchukgo.ru/privkey.pem;
    root /srv/cybertech/current/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html =503; }
}
